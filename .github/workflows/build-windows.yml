name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Дозволяє запустити збірку вручну з GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller flet pillow

      - name: Build GUI App
        run: |
          # Використовуємо flet pack для правильного пакування Flet додатку
          flet pack main.py --name "BoxerApp" --icon "app_icon.png" --onedir -y
          
      - name: Build CLI
        run: |
          # Збираємо консольну утиліту (без --windowed)
          pyinstaller --noconfirm --onefile --name "boxer" "cli.py"
          
          # Копіюємо CLI у папку з GUI, щоб усе було разом
          Copy-Item "dist\boxer.exe" -Destination "dist\BoxerApp\"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boxer-Windows-Build
          path: dist/BoxerApp/
